[project]
name = "riemann-map"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "datamapplot>=0.7",
    "glasbey>=0.4.0",
    "numpy>=2.5.5",
    "pandas<3",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.3.0",
    "toponymy>=0.5.1",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "umap-learn>=0.6.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
